name: Validate and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  review-skills:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
        skill: [pair-review, cross-review]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/${{ matrix.skill }}/skills/${{ matrix.skill }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/validate-package.mjs
      - run: node --test

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-repository.mjs
