name: Validate and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  review-skills:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
        skill: [pair-review, cross-review]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/reviews/skills/${{ matrix.skill }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/validate-package.mjs
      - run: node --test

  shared-brain:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: plugins/shared-brain/skills/shared-brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML
      - run: python -m py_compile scripts/scan_memory.py
      - run: python scripts/scan_memory.py --check-profile profiles/default.yml
      - run: python scripts/scan_memory.py --check-profile profiles/vsi-engineering.yml

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-repository.mjs
