<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t d">
  <title id="t">Example SkillArray report</title>
  <desc id="d">Example output: review complete, 4 blockers, 15 confirmed findings. Critical 1, high 3, medium 6, low 5. All 15 confirmed by the auditor; 2 claims withdrawn.</desc>
  <defs>
    <style>
      .m { font: 600 24px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .s { font: 400 20px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #8696A7; }
      .ex { font: italic 400 18px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #6F8193; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
      .b2 { animation-delay: .15s } .b3 { animation-delay: .3s } .b4 { animation-delay: .45s }
      @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="460" rx="18" fill="#0B1622"/>
  <circle cx="44" cy="40" r="7" fill="#3A4554"/><circle cx="68" cy="40" r="7" fill="#3A4554"/><circle cx="92" cy="40" r="7" fill="#3A4554"/>
  <text class="ex" x="1236" y="46" text-anchor="end">example output</text>
  <text class="m" x="44" y="100" fill="#E6EDF3">REVIEW COMPLETE · 4 blockers · 15 findings</text>

  <text class="m" x="44" y="160" fill="#FF5C8A">CRITICAL</text>
  <rect class="bar" x="230" y="142" width="112" height="24" rx="5" fill="#FF5C8A"/>
  <text class="m" x="920" y="160" fill="#FF5C8A">1</text>
  <text class="m" x="44" y="206" fill="#FF6B5E">HIGH</text>
  <rect class="bar b2" x="230" y="188" width="336" height="24" rx="5" fill="#FF6B5E"/>
  <text class="m" x="920" y="206" fill="#FF6B5E">3</text>
  <text class="m" x="44" y="252" fill="#F5B03C">MEDIUM</text>
  <rect class="bar b3" x="230" y="234" width="672" height="24" rx="5" fill="#F5B03C"/>
  <text class="m" x="920" y="252" fill="#F5B03C">6</text>
  <text class="m" x="44" y="298" fill="#6EA6FF">LOW</text>
  <rect class="bar b4" x="230" y="280" width="560" height="24" rx="5" fill="#6EA6FF"/>
  <text class="m" x="920" y="298" fill="#6EA6FF">5</text>

  <text class="s" x="44" y="356">  FIX NOW    F1  Refund total counts a partial refund twice</text>
  <text class="s" x="44" y="388">  FIX NOW    F2  Retry resends a payment after a timeout   (+F3 F4)</text>
  <text class="m" x="44" y="432" fill="#3CC3CC">+ VERIFIED   all 15 findings are confirmed by the auditor · 2 withdrawn</text>
</svg>
